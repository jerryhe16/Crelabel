name: CI

env:
  PYTHONUTF8: "1"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt zxing-cpp
      - run: python -m py_compile crelabel.py label_core.py feishu_client.py compact_label.py windows_print.py tools/verify_crelabel.py
      - run: python tools/verify_crelabel.py
      - run: python tools/verify_source_layout.py
